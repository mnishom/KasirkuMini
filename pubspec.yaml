name: kasirku_mini
description: "KasirKu Mini - Aplikasi kasir sederhana untuk warung/kios kecil. Proyek capstone mata kuliah Pemrograman Berorientasi Objek (PBO)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

# Dependency dijaga seminimal mungkin sesuai kebutuhan proyek:
# - sqflite & path  : penyimpanan data lokal (Pertemuan 15)
# - intl             : format Rupiah & tanggal di UI
dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.1
  path: ^1.9.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
